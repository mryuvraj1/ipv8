name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test -z "$(gofmt -l cmd internal web)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /tmp/ipv8 ./cmd/ipv8
      - run: sh -n install.sh
      - run: node --check web/app.js
