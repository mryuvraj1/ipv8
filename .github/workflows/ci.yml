name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: test -z "$(gofmt -l cmd internal web)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/ipv8-linux-amd64 ./cmd/ipv8
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/ipv8-linux-arm64 ./cmd/ipv8
      - run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /tmp/ipv8-android-arm64 ./cmd/ipv8
      - run: bash -n install.sh
      - run: sh -n deploy/configure-cloudflare.sh
      - run: node --check web/app.js
      - run: python3 tests/installer_test.py -v
