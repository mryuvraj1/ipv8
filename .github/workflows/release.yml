name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build Linux agents and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$version" -o "dist/ipv8-linux-$arch" ./cmd/ipv8
          done
          cp packaging/ipv8-agent.service dist/ipv8-agent.service
          (cd dist && sha256sum ipv8-linux-amd64 ipv8-linux-arm64 ipv8-agent.service > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ipv8-linux-amd64
            dist/ipv8-linux-arm64
            dist/ipv8-agent.service
            dist/SHA256SUMS
